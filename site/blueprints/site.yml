title: Sitio

tabs:
  pages:
    label:
      es: Páginas
      en: Pages
    icon: dashboard
    sections:
      pages:
        headline: Pages
        type: pages
        templates:
          - home
          - about
          - services
          - contact

  brand:
    label: Logotipo
    icon: image
    sections:
      brandFields:
        type: fields
        fields:
          brandLogo:
            label: Logotipo (navegación)
            type: files
            query: site.images
            multiple: false
            uploads:
              template: image
            help: Se muestra sobre fondo blanco. Se recomienda SVG.
          brandFavicon:
            label: Favicon
            type: files
            query: site.images
            multiple: false
            uploads:
              template: image
            help: Ícono de la pestaña del navegador. Se recomienda SVG.
          brandName:
            label: Nombre de la marca
            type: text
            help: Texto alternativo del logotipo y respaldo si no hay imagen.
            width: 1/2
          brandTagline:
            label: Lema
            type: text
            width: 1/2

  header:
    label: Encabezado
    icon: window
    sections:
      headerFields:
        type: fields
        fields:
          topBarPhoneIcon:
            label: Icono teléfono
            extends: fields/icon
            width: 1/4
          topBarPhone:
            label: Teléfono
            type: text
            width: 1/4
          topBarEmailIcon:
            label: Icono correo
            extends: fields/icon
            width: 1/4
          topBarEmail:
            label: Correo
            type: email
            width: 1/4
          topBarTagIcon:
            label: Icono acreditación
            extends: fields/icon
            width: 1/4
          topBarTag:
            label: Acreditación
            type: text
            width: 1/4
          topBarCoverageIcon:
            label: Icono cobertura
            extends: fields/icon
            width: 1/4
          topBarCoverage:
            label: Cobertura
            type: text
            width: 1/4
          navItems:
            label: Menú de navegación
            type: structure
            columns:
              label: true
              url: true
            fields:
              label:
                label: Texto
                type: text
                width: 1/2
              url:
                label: Enlace
                type: text
                width: 1/2
          navCtaLabel:
            label: Botón – texto
            type: text
            width: 1/3
          navCtaUrl:
            label: Botón – enlace
            type: text
            width: 1/3
          navCtaIcon:
            label: Botón – icono
            extends: fields/icon
            width: 1/3

  footer:
    label: Pie de página
    icon: info-card
    sections:
      footerFields:
        type: fields
        fields:
          footerDescription:
            label: Descripción
            type: textarea
            size: small
          footerBadgeIcon:
            label: Icono de la insignia
            extends: fields/icon
            width: 1/3
          footerBadge:
            label: Insignia
            type: text
            width: 2/3
          footerServicesTitle:
            label: Servicios – título
            type: text
          footerServices:
            label: Servicios
            type: structure
            columns:
              label: true
            fields:
              label:
                label: Texto
                type: text
              url:
                label: Enlace
                type: text
          footerRegulationTitle:
            label: Marco regulatorio – título
            type: text
          footerRegulation:
            label: Marco regulatorio
            type: structure
            columns:
              code: true
              text: true
            fields:
              code:
                label: Clave
                type: text
                width: 1/3
              text:
                label: Descripción
                type: text
                width: 2/3
          footerContactTitle:
            label: Contacto – título
            type: text
          footerContactText:
            label: Contacto – texto
            type: textarea
            size: small
          footerPhone:
            label: Teléfono
            type: text
            width: 1/2
          footerEmail:
            label: Correo
            type: email
            width: 1/2
          footerHours:
            label: Horario
            type: text
          footerCopyright:
            label: Derechos reservados
            type: text
          footerLinks:
            label: Enlaces legales
            type: structure
            columns:
              label: true
              url: true
            fields:
              label:
                label: Texto
                type: text
                width: 1/2
              url:
                label: Enlace
                type: text
                width: 1/2
          footerCreditHeadline:
            label: Crédito de diseño y desarrollo
            type: headline
          footerCreditText:
            label: Texto
            type: text
            width: 1/3
          footerCreditUrl:
            label: Enlace
            type: text
            width: 1/3
          footerCreditLogo:
            label: Ícono
            type: files
            query: site.images
            multiple: false
            uploads:
              template: image
            width: 1/3

  form:
    label: Formulario
    icon: edit
    sections:
      formFields:
        type: fields
        fields:
          formInfo:
            type: info
            theme: info
            text: Este formulario se muestra en Home, Servicios y Contacto. Cada solicitud se guarda en la pestaña **Solicitudes** y se envía por correo.
          formRecipient:
            label: Correo que recibe las solicitudes
            type: email
            help: Si está vacío se usa MAIL_FROM_ADDRESS del .env.
          formBadge:
            label: Encabezado – insignia (opcional)
            type: text
            width: 1/3
          formTitle:
            label: Encabezado – título (opcional)
            type: text
            width: 2/3
          formText:
            label: Encabezado – descripción (opcional)
            type: text
          formFieldsHeadline:
            label: Campos
            type: headline
          formNameLabel:
            label: Nombre – etiqueta
            type: text
            width: 1/2
          formNamePlaceholder:
            label: Nombre – ejemplo
            type: text
            width: 1/2
          formCompanyLabel:
            label: Empresa – etiqueta
            type: text
            width: 1/2
          formCompanyPlaceholder:
            label: Empresa – ejemplo
            type: text
            width: 1/2
          formEmailLabel:
            label: Correo – etiqueta
            type: text
            width: 1/2
          formEmailPlaceholder:
            label: Correo – ejemplo
            type: text
            width: 1/2
          formPhoneLabel:
            label: Teléfono – etiqueta
            type: text
            width: 1/2
          formPhonePlaceholder:
            label: Teléfono – ejemplo
            type: text
            width: 1/2
          formServiceLabel:
            label: Servicio – etiqueta
            type: text
          formServiceOptions:
            label: Servicio – opciones
            type: structure
            columns:
              label: true
            fields:
              label:
                label: Opción
                type: text
          formLocationLabel:
            label: Ciudad / estado – etiqueta
            type: text
            width: 1/2
          formLocationPlaceholder:
            label: Ciudad / estado – ejemplo
            type: text
            width: 1/2
          formPeopleLabel:
            label: Personas – etiqueta
            type: text
          formPeopleOptions:
            label: Personas – opciones
            type: structure
            columns:
              label: true
            fields:
              label:
                label: Opción
                type: text
          formModalityLabel:
            label: Modalidad – etiqueta
            type: text
          formModalityOptions:
            label: Modalidad – opciones
            type: structure
            columns:
              label: true
            fields:
              label:
                label: Opción
                type: text
          formCommentsLabel:
            label: Comentarios – etiqueta
            type: text
            width: 1/2
          formCommentsPlaceholder:
            label: Comentarios – ejemplo
            type: text
            width: 1/2
          formSubmitLabel:
            label: Botón de envío
            type: text
            width: 1/2
          formSubmitIcon:
            label: Icono del botón
            extends: fields/icon
            width: 1/2
          formSuccess:
            label: Mensaje de éxito
            type: text
          formError:
            label: Mensaje de error
            type: text
          formFieldError:
            label: Mensaje de campo inválido
            type: text
            help: Aparece bajo cada campo obligatorio que falta o es incorrecto.

  leads:
    label: Solicitudes
    icon: email
    sections:
      leads:
        type: pages
        headline: Solicitudes recibidas
        parent: site.find('solicitudes')
        status: all
        sortBy: createdAt desc
        text: "{{ page.company }} – {{ page.name }}"
        info: "{{ page.createdAt }} · {{ page.service }}"
        image: false
        create: false
        limit: 30

  seo:
    label: SEO
    icon: search
    sections:
      seoFields:
        type: fields
        fields:
          seoDefaultsHeadline:
            label: Valores por defecto
            type: headline
          seoTitleSeparator:
            label: Separador del título
            type: text
            default: '|'
            width: 1/4
            help: Resultado, p. ej.&#58; Título de la página | Nombre del sitio
          seoDescription:
            label: Meta descripción por defecto
            type: textarea
            size: small
            maxlength: 160
            counter: true
            width: 3/4
            help: Se usa en las páginas que no definen la suya.
          seoRobots:
            label: Indexación
            type: select
            default: index,follow
            options:
              index,follow: Permitir indexar (index, follow)
              noindex,nofollow: Bloquear (noindex, nofollow)
            width: 1/2
          seoThemeColor:
            label: Color del navegador (móvil)
            type: text
            default: '#060b16'
            width: 1/2
          ogHeadline:
            label: Open Graph y redes sociales
            type: headline
          seoOgSiteName:
            label: Nombre del sitio (og:site_name)
            type: text
            width: 1/2
          seoOgLocale:
            label: Idioma / región (og:locale)
            type: text
            default: es_MX
            width: 1/2
          seoOgImage:
            label: Imagen por defecto
            type: files
            query: site.images
            multiple: false
            uploads:
              template: image
            help: 1200 × 630 px (JPG o PNG). Se usa cuando la página no tiene imagen propia.
          seoTwitterCard:
            label: Tipo de tarjeta de Twitter / X
            type: select
            default: summary_large_image
            options:
              summary_large_image: Resumen con imagen grande
              summary: Resumen
            width: 1/2
          seoTwitterSite:
            label: Usuario de Twitter / X
            type: text
            placeholder: '@sicsi'
            width: 1/2

  settings:
    label:
      es: Configuration
      en: Settings
    icon: settings
    columns:
      content:
        type: fields
        width: 2/3
        fields:
          settingsLine:
            type: line
      sidebar:
        sticky: true
        width: 1/3
        sections:
          files:
            type: files
