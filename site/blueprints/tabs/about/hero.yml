label: Hero
icon: image
sections:
  content:
    type: fields
    fields:
      heroImage:
        label: Imagen de fondo
        type: files
        query: page.images
        multiple: false
        uploads:
          template: image
      heroBadgeIcon:
        label: Icono de la insignia
        extends: fields/icon
        width: 1/3
      heroBadge:
        label: Insignia superior
        type: text
        width: 2/3
      heroTitle:
        label: Título
        type: textarea
        size: small
        buttons: false
      heroText:
        label: Descripción
        type: textarea
        size: small
      heroChips:
        label: Datos destacados
        type: structure
        columns:
          text: true
        fields:
          icon:
            extends: fields/icon
            width: 1/3
          text:
            label: Texto
            type: text
            width: 2/3
      heroPrimaryLabel:
        label: Botón principal – texto
        type: text
        width: 1/4
      heroPrimaryIcon:
        label: Botón principal – icono
        extends: fields/icon
        width: 1/4
      heroPrimaryUrl:
        label: Botón principal – enlace
        type: text
        width: 1/2
      heroSecondaryLabel:
        label: Botón secundario – texto
        type: text
        width: 1/4
      heroSecondaryIcon:
        label: Botón secundario – icono
        extends: fields/icon
        width: 1/4
      heroSecondaryUrl:
        label: Botón secundario – enlace
        type: text
        width: 1/2
