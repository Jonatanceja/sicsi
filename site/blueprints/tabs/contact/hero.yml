label: Hero
icon: image
sections:
  heroFields:
    type: fields
    fields:
      heroImage:
        label: Imagen de fondo
        type: files
        query: page.images
        multiple: false
        uploads:
          template: image
      heroBadge:
        label: Insignia superior
        type: text
      heroTitleStart:
        label: Título – inicio
        type: text
        width: 1/3
      heroTitleHighlight:
        label: Título – texto resaltado
        type: text
        width: 1/3
      heroTitleEnd:
        label: Título – final
        type: text
        width: 1/3
      heroText:
        label: Descripción
        type: textarea
        size: small
      heroChips:
        label: Datos destacados
        type: structure
        columns:
          text: true
        fields:
          icon:
            extends: fields/icon
            width: 1/3
          text:
            label: Texto
            type: text
            width: 2/3
